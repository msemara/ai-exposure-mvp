[workspace]
resolver = "2"
members = ["crates/types", "crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aiexposure-types = { path = "crates/types" }
aiexposure-core = { path = "crates/core" }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["chrono-impl", "serde-compat"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
