name: Deploy database migrations

# Applies supabase/migrations to a hosted project. Each target is a GitHub
# environment holding SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
# SUPABASE_PROJECT_REF. Protect supabase-prod-us with required reviewers.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Project to migrate
        type: choice
        options: [supabase-dev, supabase-prod-us]
        default: supabase-dev

concurrency:
  group: db-deploy-${{ inputs.target || 'supabase-dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'supabase-dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the environment is configured
        id: configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets are not set for this environment yet; skipping (see docs/phase-0.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.configured.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.configured.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.ok == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.configured.outputs.ok == 'true'
        run: pnpm exec supabase db push
